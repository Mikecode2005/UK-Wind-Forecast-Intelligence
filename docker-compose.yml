version: "3.8"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1/datasets
      - ELEXON_ENABLE_CACHE=1
      - ELEXON_REQUEST_TIMEOUT=40
    volumes:
      - ./backend/.cache:/app/.cache
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
